name: Deploy proofs page to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache-bust assets per deploy
        run: sed -i "s/proofs.css/proofs.css?v=${GITHUB_SHA::8}/" docs-site/index.html

      - uses: actions/configure-pages@v5

      - uses: oven-sh/setup-bun@v2
      - name: Version pills must match elm.json
        run: bun run docs-site/build-versions.ts --check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site
      - id: deployment
        uses: actions/deploy-pages@v4
